#话题
image_topic: "/hk_camera/image_raw"
camera_info_topic: "/hk_camera/camera_info"
image_queue_size: 1

#颜色阈值(HSV)
red_h_min1: 0
red_h_max1: 20
red_h_min2: 150
red_h_max2: 180
blue_h_min: 95
blue_h_max: 135
s_min: 90
s_max: 255
v_min: 120
v_max: 255

#灯条过滤
min_area: 20.0
min_bar_ratio: 1.5
max_bar_ratio: 20.0
max_bar_angle: 45.0
min_fill_ratio: 0.5

#配对装甲板
#装甲板参数
small_half_w: 0.0675
big_half_w: 0.1175
bar_half_len: 0.0275
  
#配对条件
max_y_diff: 0.25
max_angle_diff: 10.0
max_bar_length_diff: 0.30 #灯条长度一致性
max_bar_width_diff: 0.40 #灯条宽度一致性
min_v_control: 0.94 #设置最底亮度，排除反光干扰
max_x_dist_ratio: 6.0
min_x_dist_ratio: 1.0
bar_size_ratio: 3.2

#解算器参数
max_reproj_error: 3.0
force_vertical_plate: true
memory_timeout: 0.5

#神经网络识别
nn_model_path: "package://ft_detector/model/armor.onnx"
nn_input_width: 640
nn_input_height: 480
nn_pad_value: 124
nn_color_thresh: 0.50
nn_number_thresh: 0.50
nn_nms_iou: 0.50
nn_max_detections: 8
nn_large_by_number: [0, 0, 0, 0, 0, 0, 1, 1, 1]
nn_intra_threads: 2
nn_verbose_output: true
nn_debug_every_n: 30