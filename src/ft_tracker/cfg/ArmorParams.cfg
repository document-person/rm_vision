#!/usr/bin/env python
PACKAGE = "ft_tracker"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#跟踪参数
gen.add("track_gate_chi2", double_t, 0, "Track Gate Chi2 (3 dof)", 11.34, 1.0, 30.0)   # 马氏距离卡方阈值，11.34≈99%、16.27≈99.9%
gen.add("track_confirm_hits", int_t, 0, "Track Confirm Hits", 2, 1, 5)
gen.add("track_lost_time", double_t, 0, "Track Lost Time (sec)", 0.5, 0.1, 2.0)
gen.add("track_max_tracks", int_t, 0, "Track Max Num", 8, 1, 20)
gen.add("track_R_xy", double_t, 0, "Track R xy (m^2)", 1e-4, 1e-6, 1e-2) # 量测方差，σxy≈1 cm
gen.add("track_R_z", double_t, 0, "Track R z (m^2)", 0.02, 1e-4, 0.5) # 量测方差，σz≈14 cm
gen.add("track_acc_var", double_t, 0, "Track Acc Var ((m/s2)^2)", 6.0, 0.1, 100.0)  # 加速度方差 σa²，σa=3 m/s²
gen.add("track_vel_var_max", double_t, 0, "Track Vel Var Max ((m/s)^2)", 0.5, 0.01, 10.0)  # 速度方差上限，σv<0.5 m/s 才 valid
gen.add("track_v_max", double_t, 0, "Track Max Speed (m/s)", 5.0, 1.0, 20.0) # 速度硬限幅
gen.add("track_a_max", double_t, 0, "Max Accel (m/s2)", 10.0, 1.0, 30.0) # 单帧速度变化上限 = a_max*dt
gen.add("track_dv_step", double_t, 0, "Max Vel Step (m/s)", 0.5, 0.05, 3.0)  # 单帧速度修正硬上限
gen.add("track_reacq_dist", double_t, 0, "Target Reacquire Dist (m)", 0.8, 0.1, 2.0)  # 目标层ID：跳变容忍
gen.add("track_id_memory", double_t, 0, "Target ID Memory (s)", 4.0, 1.0, 8.0)  # 断档后保留 id 的时长
gen.add("T", double_t, 0, "Predict Lead Time T (sec)", 0.1, 0.0, 0.5) # 提前量



exit(gen.generate(PACKAGE, "ft_tracker", "ArmorParams"))